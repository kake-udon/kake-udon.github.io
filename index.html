<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>MLB Watch | 日本語でMLBをまるごと</title>
<meta name="description" content="日本にいながらMLBの試合結果・順位表を日本時間でチェックできるPWA" />
<meta name="theme-color" content="#0a1120" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="stadium-glow"></div>
<div class="app-shell">

  <header class="app-header">
    <p class="eyebrow">MLB WATCH</p>
    <h1 id="header-title">ホーム</h1>
    <div class="jst-clock" id="jst-clock">--:--</div>
    <div id="offline-indicator"></div>
  </header>

  <main>
    <section id="view-home" class="view active"></section>
    <section id="view-standings" class="view"></section>
    <section id="view-team-search" class="view"></section>
    <section id="view-player-search" class="view"></section>
    <section id="view-my-players" class="view"></section>
    <section id="view-rules" class="view"></section>
  </main>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-route="home" aria-label="ホーム">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
      ホーム
    </button>
    <button class="nav-btn" data-route="standings" aria-label="順位表">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>
      順位表
    </button>
    <button class="nav-btn" data-route="team-search" aria-label="チーム検索">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      チーム検索
    </button>
    <button class="nav-btn" data-route="player-search" aria-label="選手検索">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9.5" cy="8" r="3.5"/><path d="M3.5 20c0-3.6 2.7-6 6-6s6 2.4 6 6"/><circle cx="17" cy="16" r="3.3"/><path d="m21 20-2-2"/></svg>
      選手検索
    </button>
    <button class="nav-btn" data-route="my-players" aria-label="マイ成績">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="8" cy="7" r="3"/><path d="M2 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><path d="m14 13 3-3 2 2 4-4"/></svg>
      マイ成績
    </button>
    <button class="nav-btn" data-route="rules" aria-label="ルール解説">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v17.5a1 1 0 0 1-1 1H6.5A2.5 2.5 0 0 0 4 22V4.5Z"/><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/></svg>
      ルール
    </button>
  </nav>

</div>

<div id="sheet-root"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
