name: Send push notification digest

on:
  schedule:
    # GitHub Actionsのスケジュール実行は混雑時に数時間〜半日遅延することがある
    # （実測で深夜〜翌朝に起動した回があった）。そのため
    #   ・混雑しやすい「毎時0分」を避ける
    #   ・送りたい時間帯に複数回起動し、どれかが時間内に走ればよいようにする
    # という方針にしている。実際に送るかどうかは scripts/send-notifications.mjs が
    # JSTの送信ウィンドウ（15:00〜17:59）で判定し、ウィンドウ外に遅延した回は送信しない。
    # cronの時刻だけを信用する実装に戻さないこと。
    #
    # MLBの試合は日本時間の朝〜昼に終わる（レギュラーシーズンで最も遅い西海岸のナイターでも
    # 14:30頃）。結果が出そろう15時台から送ることにし、レギュラーシーズンとポストシーズンで
    # 時間帯は分けない（設定が二重にならないようにするため）。
    #
    # 06:05/06:35/07:05/07:35/08:05/08:35 UTC = 15:05/15:35/16:05/16:35/17:05/17:35 JST
    - cron: '5,35 6,7,8 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '本日分の送信済みガードと送信ウィンドウ判定を無視して即時テスト送信する'
        type: boolean
        default: false

# 遅延した回と次の回が同時に走って二重送信するのを防ぐ（先行実行を止めずに直列化する）
concurrency:
  group: send-push-notification-digest
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: node scripts/send-notifications.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          FORCE_SEND: ${{ inputs.force }}
