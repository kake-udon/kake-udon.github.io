name: Send push notification digest

on:
  schedule:
    # 送信したいのは18:00 JST（09:00 UTC）だが、GitHub Actionsのスケジュール実行は混雑時に
    # 数時間〜半日遅延することがある（実測で深夜〜翌朝に起動した回があった）。そのため
    #   ・混雑しやすい「毎時0分」を避ける
    #   ・夕方の時間帯に複数回起動し、どれかが時間内に走ればよいようにする
    # という方針にしている。実際に送るかどうかは scripts/send-notifications.mjs が
    # JSTの送信ウィンドウ（既定18:00〜20:59）で判定し、ウィンドウ外に遅延した回は送信しない。
    # 09:05/09:35/10:05/10:35/11:05/11:35 UTC = 18:05/18:35/19:05/19:35/20:05/20:35 JST
    - cron: '5,35 9,10,11 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '本日分の送信済みガードと送信ウィンドウ判定を無視して即時テスト送信する'
        type: boolean
        default: false

# 遅延した回と次の回が同時に走って二重送信するのを防ぐ（先行実行を止めずに直列化する）
concurrency:
  group: send-push-notification-digest
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: node scripts/send-notifications.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          FORCE_SEND: ${{ inputs.force }}
