name: Send push notification digest

on:
  schedule:
    # GitHub Actionsのスケジュール実行は混雑時に数時間〜半日遅延することがある
    # （実測で深夜〜翌朝に起動した回があった）。そのため
    #   ・混雑しやすい「毎時0分」を避ける
    #   ・送りたい時間帯に複数回起動し、どれかが時間内に走ればよいようにする
    # という方針にしている。実際に送るかどうかは scripts/send-notifications.mjs が
    # JSTの送信ウィンドウ（15:00〜23:59）で判定し、日付をまたぐほど遅延した回は送信しない。
    # 送信済みの日は last_notified_date で2回目以降が何もしないので、起動回数が多くても二重送信はない。
    # cronの時刻だけを信用する実装に戻さないこと。
    #
    # MLBの試合は日本時間の朝〜昼に終わる（レギュラーシーズンで最も遅い西海岸のナイターでも
    # 14:30頃）。結果が出そろう15時から送ることにし、レギュラーシーズンとポストシーズンで
    # 時間帯は分けない（設定が二重にならないようにするため）。
    # 以前はウィンドウを15:00〜17:59にしていたが、実測では起動が毎日1回・19〜21時台に
    # ずれ込み、全回スキップで通知が届かなかった（2026-09-04〜09-22）。
    #
    # 06:05〜14:35 UTC の毎時5分・35分 = 15:05〜23:35 JST
    - cron: '5,35 6-14 * * *'
    # 定期実行の自動停止を防ぐ回（毎月1日・15日 12:17 JST）。下の keepalive ステップの説明を参照。
    # 送信ウィンドウ外なので通知は送らず、Supabaseへの疎通確認（pingSupabase）だけが走る。
    - cron: '17 3 1,15 * *'
  workflow_dispatch:
    inputs:
      force:
        description: '本日分の送信済みガードと送信ウィンドウ判定を無視して即時テスト送信する'
        type: boolean
        default: false

# 遅延した回と次の回が同時に走って二重送信するのを防ぐ（先行実行を止めずに直列化する）
concurrency:
  group: send-push-notification-digest
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # keepalive でこのワークフローを有効化し直すため
    steps:
      # GitHubは、リポジトリに60日間更新（コミット等）が無いと定期実行を自動で無効にする。
      # オフシーズンはコミットが途絶えやすく、止まると pingSupabase も走らなくなって
      # Supabase無料枠も7日後に一時停止する（2026-09に通知が途絶えたのと同じ状態になる）。
      # 月2回、APIでこのワークフローを有効化し直して、無効化までの期間をリセットする。
      # 後続のステップが失敗しても実行されるよう先頭に置く。
      - name: keepalive（定期実行の自動停止を防ぐ）
        if: github.event.schedule == '17 3 1,15 * *'
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/notify.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: node scripts/send-notifications.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          FORCE_SEND: ${{ inputs.force }}
